<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVEM PS Tracker</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f2f4f7;
}

header {
  background: #111;
  color: white;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin: 20px;
  border-radius: 15px;
}

.number {
  font-size: 40px;
  font-weight: bold;
}

.timer {
  font-size: 30px;
  margin-top: 10px;
  color: green;
}

button {
  width: 90%;
  padding: 15px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}

.start { background: green; color: white; }
.stop { background: red; color: white; }
.reset { background: #ddd; }
</style>
</head>

<body>

<header>
<h1>🎮 AVEM PS TRACKER</h1>
</header>

<div class="card">
<div>Matchs aujourd’hui</div>
<div class="number" id="count">0</div>

<div class="timer" id="timer">⏱️ 00:00</div>

<button class="start" onclick="startMatch()">▶️ Démarrer</button>
<button class="stop" onclick="endMatch()">⏹️ Terminer</button>
<button class="reset" onclick="reset()">🔄 Reset</button>
</div>

<div class="card">
<div>Historique</div>
<div id="history"></div>
</div>

<script>

let data = JSON.parse(localStorage.getItem("psData")) || {};
let startTime = null;
let interval = null;

function getToday() {
  return new Date().toISOString().split("T")[0];
}

function startMatch() {
  startTime = new Date();

  interval = setInterval(() => {
    const now = new Date();
    const diff = Math.floor((now - startTime) / 1000);

    const min = Math.floor(diff / 60);
    const sec = diff % 60;

    document.getElementById("timer").textContent =
      "⏱️ " + String(min).padStart(2,"0") + ":" + String(sec).padStart(2,"0");

  }, 1000);
}

function endMatch() {
  if (!startTime) {
    alert("Démarre un match !");
    return;
  }

  clearInterval(interval);

  const end = new Date();
  const duration = Math.floor((end - startTime) / 60000);

  const today = getToday();

  if (!data[today]) data[today] = [];

  data[today].push({
    start: startTime.toLocaleTimeString(),
    end: end.toLocaleTimeString(),
    duration: duration
  });

  startTime = null;

  save();
  update();
}

function save() {
  localStorage.setItem("psData", JSON.stringify(data));
}

function reset() {
  data = {};
  save();
  update();
  document.getElementById("timer").textContent = "⏱️ 00:00";
}

function update() {
  const today = getToday();
  const matches = data[today] || [];

  document.getElementById("count").textContent = matches.length;

  let history = document.getElementById("history");
  history.innerHTML = "";

  matches.forEach((m, i) => {
    let div = document.createElement("div");
    div.innerHTML = `🎮 Match ${i+1} : ${m.start} - ${m.end} (${m.duration} min)`;
    history.appendChild(div);
  });
}

update();

</script>

</body>
</html>
