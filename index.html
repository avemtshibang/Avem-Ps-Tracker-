<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVEM PS Tracker</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      text-align: center;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
    }

    .container {
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .number {
      font-size: 50px;
      font-weight: bold;
    }

    .time {
      font-size: 20px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .start {
      background: green;
      color: white;
    }

    .stop {
      background: red;
      color: white;
    }

    .reset {
      background: #ddd;
    }

    .history {
      text-align: left;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>🎮 AVEM PS TRACKER</h1>
</header>

<div class="container">

  <div class="card">
    <div>Matchs aujourd’hui</div>
    <div class="number" id="count">0</div>
    <div class="time" id="totalTime">Temps total : 0 min</div>

    <button class="start" onclick="startMatch()">▶️ Démarrer match</button>
    <button class="stop" onclick="endMatch()">⏹️ Terminer match</button>
    <button class="reset" onclick="reset()">🔄 Réinitialiser</button>
  </div>

  <div class="card">
    <div>Historique</div>
    <div class="history" id="history"></div>
  </div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("psData")) || {};
let currentStart = null;

function getToday() {
  return new Date().toISOString().split("T")[0];
}

function startMatch() {
  currentStart = new Date();
  alert("Match démarré !");
}

function endMatch() {
  if (!currentStart) {
    alert("Démarre d'abord un match !");
    return;
  }

  const end = new Date();
  const duration = Math.floor((end - currentStart) / 60000);

  const today = getToday();

  if (!data[today]) data[today] = [];

  data[today].push({
    start: currentStart.toLocaleTimeString(),
    end: end.toLocaleTimeString(),
    duration: duration
  });

  currentStart = null;

  save();
  update();
}

function save() {
  localStorage.setItem("psData", JSON.stringify(data));
}

function reset() {
  if (confirm("Supprimer les données ?")) {
    data = {};
    save();
    update();
  }
}

function update() {
  const today = getToday();
  const matches = data[today] || [];

  document.getElementById("count").textContent = matches.length;

  let total = 0;
  matches.forEach(m => total += m.duration);

  document.getElementById("totalTime").textContent = "Temps total : " + total + " min";

  const history = document.getElementById("history");
  history.innerHTML = "";

  matches.forEach((m, i) => {
    const div = document.createElement("div");
    div.innerHTML = `🎮 Match ${i+1} : ${m.start} - ${m.end} (${m.duration} min)`;
    history.appendChild(div);
  });
}

update();

</script>

</body>
</html>
